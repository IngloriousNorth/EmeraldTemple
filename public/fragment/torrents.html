<div class="titleBreak">
  <h2 id="torrentsTitle"><span><a href="#torrents" class="TEMPEST torrents"></a></span></h2>
</div>

  <div class="adv_show">
      <!-- Row 1 -->
      <select class="adv_type" id="adv_type"><option value="all">Type</option></select>
      <form>
      	<input type="search" id="adv_title" placeholder="Title">
    	</form>
      <!-- Row 2 -->
      <select class="adv_media" id="adv_media"><option value="all">Media</option></select>
      <form>
      	<input type="search" id="adv_author" placeholder="Author">
      </form>
      <!-- Row 3 -->
      <select class="adv_format" id="adv_format"><option value="all">Format</option></select>
      <form>
      	<input type = "search" id="adv_classes" placeholder="Classes (comma-separated)">
      </form>
      <!-- Row 4 -->
      <select class="adv_res" id="adv_res"><option value="all">Resolution</option></select>
      <form>
      	<input type="search" id="adv_publisher" placeholder="Publisher">
      </form>
      <!-- Bottom Link -->
     
  </div>
<script>
	document.querySelector('.adv_show').addEventListener('keydown', function(event) {
	    // Check if the pressed key is 'Enter'
	    if (event.key === 'Enter') {
	        // Identify if the active element is an input or select within this div
	        const isField = event.target.matches('input, select, textarea');
	        
	        if (isField) {
	            // Prevent default behavior (like submitting a hidden form)
	            event.preventDefault();
	            
	            const submitBtn = document.querySelector('#road');
	            if (submitBtn) {
	                submitBtn.click();
	            }
	        }
	    }
	});

	// Update tooltips dynamically to avoid showing "Click to copy" over the publisher
	$(document).on('mouseenter', '.apa-former', function() {
	    $(this).closest('.apa-trigger').attr('title', 'Click to copy citation');
	}).on('mouseleave', '.apa-former', function() {
	    $(this).closest('.apa-trigger').removeAttr('title');
	});
</script>

<table width="100%" max-width="100%" id="torrents" class="torrents">
	<thead>
		<tr>
			<th>Source / Date / Author</th> <!--hidden column header !-->
			<th class="table_edition">APA</th> <!--edition !-->			
			<th>Revs</th>
      		<th class="table_date">Date</th>
			<th>Time</th>
			<th class="none torrents"></th> <!-- hidden responsive + !-->
		</tr>
	</thead>
	<tbody>
	</tbody>
</table>
