<!DOCTYPE html>
<html>

        <link rel="stylesheet" type="text/css" href="styles/Mystery.css"/>

        <!-- Ethers.js & jQuery (Required for Web3 auth & AJAX setup) -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- WebTorrent & Service Worker Setup -->
        <script type='module'>
            import WebTorrent from '/js/lib/webtorrent.min.js'
            const client = new WebTorrent();
            const controller = await navigator.serviceWorker.register('/sw.min.js', { scope: './' })
            await navigator.serviceWorker.ready
            client.createServer({ controller })
            window.client = client;         
        </script>

        <div class="city">
    <!-- Web3 Auth Module Script -->
    <script type="module">
        import EthersAuth from '../js/hook/web3-auth.js';

        document.addEventListener('DOMContentLoaded', function() {
                let isAuthenticated = false;

                // 2. Verify and route to #torrents when .GATE is clicked
                const gateElement = document.querySelector('#lock');
                if (gateElement) {
                    gateElement.addEventListener('click', function() {
                         // 1. Login via MetaMask on page load
                        EthersAuth.initAuth(function(authenticated) {
                            isAuthenticated = authenticated;
                            if (authenticated) {
                                const script = document.createElement('script');
                                script.src = '../js/bundle.js';
                                document.body.appendChild(script);
                            }
                        });
                    });
                }
            });
        </script>

        <div class="GATE" style="cursor: pointer;">
            <span id="lock">&#x13296;</span>
            <p id="inscription">
                Here lies the solution to the great educational reform so necessary at this time. We can not hope to build a nobility of man upon the sterility of a narrow, competitive, materialistic educational policy. The ignorance of man has been his undoing. Only wisdom can restore him to his divine estate. 
            </p> 
        </div>
    </div>
