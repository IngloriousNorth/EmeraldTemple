<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EmeraldTemple</title>    
    <meta name="description" content="1) Authenticate swarm token with @noble crypto 2) Connect to peers using PEX 3) Organize torrent metadata using IndexedDB 4) Display a JQuery-UI DataTable and VR graph of metadata of all torrents in swarm.">
    <link rel="stylesheet" type="text/css" href="styles/style.css"/>
    <link rel="stylesheet" type="text/css" href="styles/jquery-ui.min.css"/>
    <link rel="stylesheet" type="text/css" href="styles/BS5.css"/>
    <link rel="stylesheet" type="text/css" href="styles/rowGroup.min.css"/>
    <link rel="stylesheet" type="text/css" href="styles/scroller.jqueryui.min.css"/>
    <script src="TEMPEST/TEMPEST.js" type="module"></script>

    <script src = "lib/jQuery-4.0.0.min.js"></script>

    <script src="lib/util.js"></script>

    <!-- attaches client to window !-->
    <script type='module'>
            import WebTorrent from 'https://esm.sh/webtorrent/dist/webtorrent.min.js'
            const client = new WebTorrent();
            /*const controller = await navigator.serviceWorker.register('/sw.min.js', { scope: './' })
            await navigator.serviceWorker.ready
            client.createServer({ controller })*/
            window.client = client;         
    </script>

    <!-- DECRYPTS GATE.ENC.JS and sets window.client.torrents[0].ripemd160IntegrityHash for PEX swarm !-->
    <script type="module">
        async function triggerGate() {
            if (window.__GATE_TRIGGERED__) return;
            window.__GATE_TRIGGERED__ = true;
            
            console.info("[UI] Gate trigger activated. Importing nano.min.js...");
            await import('./nano.min.js');
        }

        // 1. Desktop Keyboard Trigger
        $(document).on('keydown', async (e) => {
            if (e.key === 'Enter') {
                await triggerGate();
            }
        });

        // 2. Mobile Tap-and-Hold / Touch Trigger
        let holdTimer = null;
        
        $(document).on('touchstart', '#emerald-upload-zone, body', (e) => {
            // Start a 1-second hold timer for mobile tap-and-hold
            holdTimer = setTimeout(async () => {
                console.info("[UI] Tap and hold detected on mobile.");
                await triggerGate();
            }, 1000);
        });

        $(document).on('touchend touchmove', () => {
            // Clear timer if user releases or moves before 1 second
            if (holdTimer) {
                clearTimeout(holdTimer);
                holdTimer = null;
            }
        });
    </script>

    <!-- MVC Architecture bundle !-->
    <script src="src/bundle.min.js" type="module"></script>

</head>
<body>
    <header></header>
    <div class="TEMPEST upload"></div>
    <div class="TEMPEST webtorrent"></div>
    <div class="TEMPEST top10"></div>
    <div class="TEMPEST node"></div>
    <div class="TEMPEST Category"></div>
    <div class="TEMPEST torrents"></div>
    <div class="TEMPEST privacy"></div>
    <footer></footer>
    
    <div class="crossRoad" tabindex="0" title="Focus and Press Enter to Unlock.">
        <!-- Auth Gate Module -->
        <div class="GATE" tabindex="0" style="cursor: pointer;">
            <span id="unlock">&#x131B8;</span>
            <div>
                <p id="inscription">
                    Here lies the solution to the great educational reform so necessary at this time. We can not hope to build a nobility of man upon the sterility of a narrow, competitive, materialistic educational policy. The ignorance of man has been his undoing. Only wisdom can restore him to his divine estate. 
                </p> 
            </div>
        </div>
    </div>
</body>
</html>
